<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>E&amp;D Notes</title>
<style>
  :root {
    --bg: #edf1f2; --surface: #ffffff; --fg: #13242b; --muted: #55666e; --line: #d3dcdf;
    --accent: #0a6c74; --accent-fg: #ffffff; --bad: #a3302a;
    --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1517; --surface: #151e21; --fg: #e3ecee; --muted: #8fa2a8; --line: #2a393e;
      --accent: #5cc2c9; --accent-fg: #062a2d; --bad: #f08a83; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1517; --surface: #151e21; --fg: #e3ecee; --muted: #8fa2a8; --line: #2a393e;
    --accent: #5cc2c9; --accent-fg: #062a2d; --bad: #f08a83; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }
  label.l { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
  input[type=password] { width: 100%; font: inherit; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .small { margin: 12px 0 18px; font-size: 0.85rem; }
  button { width: 100%; font: inherit; font-weight: 700; font-size: 1rem; padding: 10px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { min-height: 1.4em; margin: 12px 0 0; color: var(--bad); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <form id="f" autocomplete="on">
    <h1>E&amp;D Notes</h1>
    <p>Enter the password to open the page. Ask the person who shared it with you.</p>
    <label class="l" for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <p class="small">For privacy, you are signed out after 30 minutes without use, and when you close the browser.</p>
    <button type="submit" id="go">Open</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>
<noscript><p style="text-align:center">This page needs JavaScript.</p></noscript>
<script>
(function () {
  'use strict';
  var P = /*PAYLOAD*/null;
  var REM = 'ed-notes-gate';
  var IDLE_MS = 30 * 60 * 1000;
  var COOKIE = 'ed-notes-session';
  // A cookie without an expiry date disappears when the browser is closed.
  function hasSession() { return document.cookie.split('; ').indexOf(COOKIE + '=1') >= 0; }
  function startSession() {
    document.cookie = COOKIE + '=1; path=/; SameSite=Strict' + (location.protocol === 'https:' ? '; Secure' : '');
    try { localStorage.setItem('ed-notes-active', String(Date.now())); } catch (e) {}
  }
  // Browser closed, or not used for 30 minutes: sign out. If some changes never reached
  // Google Drive, keep them (only ask for the password again) so they upload on next open.
  (function expire() {
    try {
      var last = +localStorage.getItem('ed-notes-active') || 0;
      if (hasSession() && !(last && Date.now() - last > IDLE_MS)) return;
      if (localStorage.getItem('ed-notes-unsynced')) { localStorage.removeItem(REM); return; }
      localStorage.removeItem('ed-notes-v1');
      Object.keys(localStorage).forEach(function (k) { if (/^ed-notes/.test(k)) localStorage.removeItem(k); });
      indexedDB.deleteDatabase('ed-notes-file');
    } catch (e) {}
  })();
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.it, hash: 'SHA-256' }, base, 256);
  }
  async function unlock(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html) {
    // replacing the page while it is still loading would mix the two pages together
    if (document.readyState !== 'complete') { window.addEventListener('load', function () { show(html); }, { once: true }); return; }
    document.open();
    document.write(html);
    document.close();
  }
  var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser cannot open the page. Use an up-to-date Chrome, Edge or Safari.';
    go.disabled = true;
    return;
  }
  // remembered on this computer?
  try {
    var r = JSON.parse(localStorage.getItem(REM) || 'null');
    if (r && r.salt === P.salt && r.k) {
      f.hidden = true;
      unlock(b64(r.k)).then(function (html) { startSession(); show(html); }, function () {
        try { localStorage.removeItem(REM); } catch (e) {}
        f.hidden = false;
      });
    }
  } catch (e) {}
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; go.textContent = 'Opening…'; msg.textContent = '';
    try {
      var raw = await derive(pw);
      var html = await unlock(raw);
      try { localStorage.setItem(REM, JSON.stringify({ salt: P.salt, k: toB64(raw) })); } catch (e2) {}
      startSession();
      show(html);
    } catch (err) {
      go.disabled = false; go.textContent = 'Open';
      msg.textContent = 'Wrong password. Try again.';
      document.getElementById('pw').select();
    }
  });
})();
</script>
</body>
</html>
